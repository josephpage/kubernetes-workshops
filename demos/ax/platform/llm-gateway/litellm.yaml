# Passerelle LLM de l'atelier : LiteLLM expose une API compatible OpenAI dans le
# cluster et route vers le fournisseur du cloud hôte (config/<fournisseur>.yaml).
#
# Les vrais identifiants restent dans le Secret llm-gateway-credentials (ou dans
# l'identité de workload du ServiceAccount) : les sandboxes AX n'en voient aucun.
#
# Rendu par scripts/40-install-llm-gateway.sh (${LITELLM_IMAGE}).
apiVersion: v1
kind: Namespace
metadata:
  name: llm-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: llm-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm-gateway
  labels:
    app.kubernetes.io/name: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      serviceAccountName: litellm
      containers:
        - name: litellm
          image: ${LITELLM_IMAGE}
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: llm-gateway-credentials
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: llm-gateway
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
---
# Le trafic sortant des sandboxes passe toujours par la passerelle de sortie de
# Substrate (atenet-egress, namespace ate-system) : c'est elle qui se connecte à
# LiteLLM. Aucun autre namespace n'a besoin d'y accéder.
# (Appliquée seulement si le CNI applique les NetworkPolicy : Cilium sur Kapsule,
# Calico/Cilium sur AKS et GKE Dataplane V2, VPC CNI avec network policy sur EKS.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-from-substrate-egress
  namespace: llm-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm-gateway
      ports:
        - port: 4000
